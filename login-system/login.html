<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAuth - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-logo">SecureAuth</h1>
                <p class="auth-subtitle">Client-Side Authentication Demo</p>
            </div>
            
            <div class="security-notice">
                <strong>⚠️ Demo Only:</strong> This is a client-side authentication system for educational purposes. 
                Do NOT use for production security.
            </div>
            
            <div class="auth-links">
                <a href="login.html" class="auth-link active">Login</a>
                <a href="register.html" class="auth-link">Register</a>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-identifier">Username or Email</label>
                    <input type="text" id="login-identifier" name="login-identifier" placeholder="Enter username or email" required>
                    <span class="error-message" id="login-identifier-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" name="login-password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                            <span class="eye-icon">👁️</span>
                        </button>
                    </div>
                    <span class="error-message" id="login-password-error"></span>
                </div>
                
                <button type="submit" class="auth-btn">Login</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
