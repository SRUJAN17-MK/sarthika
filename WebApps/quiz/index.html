<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Welcome Screen -->
    <div id="welcomeScreen" class="screen active">
        <div class="container">
            <div class="icon">🎓</div>
            <h1>GK Quiz</h1>
            <p class="description">Test Your General Knowledge<br><br>Answer 10 questions across Science, Geography, History, Technology, and India.</p>
            <button onclick="startQuiz()">START QUIZ</button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen">
        <div class="container">
            <div class="quiz-header">
                <span id="questionCounter">Question 1 of 10</span>
                <span id="score" class="score">Score: 0</span>
            </div>

            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>

            <div class="question-card">
                <p id="question" class="question-text">Question text here</p>

                <div id="options" class="options">
                    <!-- Options will be inserted here -->
                </div>
            </div>

            <button id="nextBtn" onclick="handleNext()">NEXT</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen">
        <div class="container">
            <div class="icon">🏆</div>
            <h1>Quiz Completed!</h1>

            <div class="result-card">
                <p id="totalQuestions">Total Questions: 10</p>
                <p id="correctAnswers" class="correct">Correct Answers: 0</p>
                <p id="incorrectAnswers" class="incorrect">Incorrect Answers: 0</p>
                <hr>
                <p id="scorePercentage" class="score-final">Score: 0%</p>
            </div>

            <div class="result-buttons">
                <button onclick="restartQuiz()">RESTART</button>
                <button class="exit-btn" onclick="exitQuiz()">EXIT</button>
            </div>

            <a href="../index.html" class="back-link">← Back to Main Menu</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
